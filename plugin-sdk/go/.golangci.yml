version: "2"

# 架构依赖由 make test-architecture 单独检查。

linters:
  default: none
  enable:
    - copyloopvar
    - decorder
    - errcheck
    - funcorder
    - gocritic
    - godot
    - gosec
    - govet
    - ineffassign
    - intrange
    - modernize
    - nolintlint
    - revive
    - staticcheck
    - unconvert
    - unused
    - usestdlibvars
    - whitespace

  settings:
    gosec:
      excludes:
        - G101
        - G103
        - G104
        - G109
        - G115
        - G201
        - G202
        - G301
        - G302
        - G304
        - G306
        - G404
        # G703/G704 是 G304/G107 的污点分析版：网关本职就是按配置转发到上游 URL、按配置写本地文件，
        # 污点来源即配置本身，规则不适用。
        - G703
        - G704
      severity: high
      confidence: high
    errcheck:
      # Report about not checking of errors in type assertions: `a := b.(MyStruct)`.
      # Such cases aren't reported by default.
      # Default: false
      check-type-assertions: true
      # report about assignment of errors to blank identifier: `num, _ := strconv.Atoi(numStr)`.
      # Such cases aren't reported by default.
      # Default: false
      check-blank: false
      # To disable the errcheck built-in exclude list.
      # See `-excludeonly` option in https://github.com/kisielk/errcheck#excluding-functions for details.
      # Default: false
      disable-default-exclusions: true
      # List of functions to exclude from checking, where each entry is a single function to exclude.
      # See https://github.com/kisielk/errcheck#excluding-functions for details.
      exclude-functions:
        - io/ioutil.ReadFile
        - io.Copy(*bytes.Buffer)
        - io.Copy(os.Stdout)
        - fmt.Println
        - fmt.Print
        - fmt.Printf
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
      # Display function signature instead of selector.
      # Default: false
      verbose: true
    decorder:
      # 文件内依次是 const、var、type、func，const 和 var 各用一个括号块，init 排在函数最前。
      # 新代码由 make fmt 调用 tools/declorder 自动调整。
      dec-order: [const, var, type, func]
      disable-dec-order-check: false
      disable-init-func-first-check: false
      disable-dec-num-check: false
      disable-type-dec-num-check: true
    funcorder:
      # 构造函数放在所属类型的方法前面，方法之间按调用关系排列。
      constructor: true
      struct-method: false
    revive:
      # 只开命名和控制流写法上的规则，其余 revive 默认规则不启用。
      rules:
        - name: comment-spacings
        - name: identical-branches
        - name: if-return
        - name: increment-decrement
        - name: indent-error-flow
        - name: receiver-naming
        - name: redundant-import-alias
        - name: redundant-test-main-exit
        - name: superfluous-else
        - name: unnecessary-stmt
        - name: var-declaration
    usestdlibvars:
      # 架构规则禁止部分核心包引用 net/http，状态码在这些包里写成数字。
      http-status-code: false
    gocritic:
      # 只开影响可读性、又有明确改法的检查。
      disable-all: true
      enabled-checks:
        - assignOp
        - captLocal
        - emptyStringTest
        - equalFold
        - redundantSprint
        - stringConcatSimplify
        - unslice
    godot:
      # 顶层声明的文档注释以句号结尾，中文用“。”，英文用“.”。
      scope: declarations
      exclude:
        # Project Doc 锚点是路径，句号会让路径失效。
        - '^\s*@project-doc'
        # 路由注释写的是请求方法和路径。
        - '^\s*(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS|ANY) /'
    modernize:
      disable:
        # 用到 Go 1.26 以后的新写法，读者和工具还不熟悉。
        - embedlit
        - newexpr
        # 会改变 JSON 输出或字段类型。
        - omitzero
        - atomictypes
        # t.Context() 在 t.Cleanup 之前取消，清理函数里继续使用会出错。
        - testingcontext
    nolintlint:
      # 每条 nolint 写明被关闭的 linter 和原因。
      require-specific: true
      require-explanation: true
    ineffassign:
      # Check escaping variables of type error, may cause false positives.
      # Default: false
      check-escaping-errors: true
    staticcheck:
      # https://staticcheck.dev/docs/configuration/options/#dot_import_whitelist
      dot-import-whitelist:
        - fmt
      # https://staticcheck.dev/docs/configuration/options/#initialisms
      initialisms: [ "ACL", "API", "ASCII", "CPU", "CSS", "DNS", "EOF", "GUID", "HTML", "HTTP", "HTTPS", "ID", "IP", "JSON", "QPS", "RAM", "RPC", "SLA", "SMTP", "SQL", "SSH", "TCP", "TLS", "TTL", "UDP", "UI", "GID", "UID", "UUID", "URI", "URL", "UTF8", "VM", "XML", "XMPP", "XSRF", "XSS", "SIP", "RTP", "AMQP", "DB", "TS" ]
      # https://staticcheck.dev/docs/configuration/options/#http_status_code_whitelist
      http-status-code-whitelist: [ "200", "400", "404", "500" ]
      # "all" enables every SA/ST/S/QF check; only list the ones to disable.
      checks:
        - all
        - -ST1000  # Package comment format
        - -ST1003  # Poorly chosen identifier (ApiKey vs APIKey)
        - -ST1020  # Comment on exported method format
        - -ST1021  # Comment on exported type format
        - -ST1022  # Comment on exported variable format
    unused:
      # Default: true
      field-writes-are-uses: true
      # Default: false
      post-statements-are-reads: true
      # Default: true
      exported-fields-are-used: true
      # Default: true
      parameters-are-used: true
      # Default: true
      local-variables-are-used: false
      # Default: true — must be true, ent generates 130K+ lines of code
      generated-is-used: true

formatters:
  enable:
    - gofmt
    # 使用内置 gofumpt 默认规则，不开启 extra；版本随 golangci-lint 固定。
    - gofumpt
    - gci
  exclusions:
    generated: strict
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/TokenFlux/TokenRouter)
    gofmt:
      # Simplify code: gofmt with `-s` option.
      # Default: true
      simplify: false
      # Apply the rewrite rules to the source before reformatting.
      # https://pkg.go.dev/cmd/gofmt
      # Default: []
      rewrite-rules:
        - pattern: 'interface{}'
          replacement: 'any'
        - pattern: 'a[b:len(a)]'
          replacement: 'a[b:]'
