# =============================================================================
# TokenRouter Docker Compose - Local Directory Version
# =============================================================================
# docker-compose.local.yml runs TokenRouter, PostgreSQL, and Redis with local
# directories for persistent data. Dependency health checks delay application
# startup until PostgreSQL accepts SQL and Redis responds, while the application
# receives time to complete bootstrap and database migrations.
#
# Quick Start:
#   1. Copy .env.example to .env and configure
#   2. mkdir -p data postgres_data redis_data
#   3. docker-compose -f docker-compose.local.yml up -d
#   4. Check logs: docker-compose -f docker-compose.local.yml logs -f tokenrouter
#   5. Access: http://localhost:8080
#
# Migration to New Server:
#   1. docker-compose -f docker-compose.local.yml down
#   2. tar czf tokenrouter-deploy.tar.gz deploy/
#   3. Transfer to new server and extract
#   4. docker-compose -f docker-compose.local.yml up -d
# =============================================================================

services:
  # ===========================================================================
  # TokenRouter Application
  # ===========================================================================
  tokenrouter:
    image: ghcr.io/tokenflux/tokenrouter:latest
    # Refresh latest before recreation so an in-container update is not
    # replaced by an older locally cached image.
    pull_policy: always
    container_name: tokenrouter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Reserve headroom for application peaks while preventing unexpected
    # allocations from exhausting all memory in the host virtual machine.
    mem_limit: 12g
    memswap_limit: 12g
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    ports:
      # Bind only to host loopback by default so the application is not
      # directly exposed to the public network.
      - "${BIND_HOST:-127.0.0.1}:${SERVER_PORT:-8080}:8080"
    volumes:
      # Local directory mapping for easy migration
      - ./data:/app/data:Z
      # Optional: Mount custom config.yaml (uncomment and create the file first)
      # Copy config.example.yaml to config.yaml, modify it, then uncomment:
      # The upgrader supports writable single-file mounts and creates a v1 backup.
      # - ./config.yaml:/app/data/config.yaml
    environment:
      # These inputs configure first installation; later starts read config.yaml.
      - AUTO_SETUP=true
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - SERVER_MODE=${SERVER_MODE:-release}
      - GOMEMLIMIT=${GOMEMLIMIT:-8GiB}
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${POSTGRES_USER:-tokenrouter}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - DATABASE_DBNAME=${POSTGRES_DB:-tokenrouter}
      - DATABASE_SSLMODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_USERNAME=${REDIS_USERNAME:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_ENABLE_TLS=${REDIS_ENABLE_TLS:-false}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@tokenrouter.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_EXPIRE_HOUR=${JWT_EXPIRE_HOUR:-24}
      - SETUP_MIGRATION_TIMEOUT_SECONDS=${SETUP_MIGRATION_TIMEOUT_SECONDS:-0}
      - TOTP_ENCRYPTION_KEY=${TOTP_ENCRYPTION_KEY:-}
      - TZ=${TZ:-Asia/Shanghai}

      # Explicit ${VAR} references in migrated files may still need these secrets.
      # Nonempty values have no effect unless config.yaml references their names.
      - ANTIGRAVITY_OAUTH_CLIENT_SECRET=${ANTIGRAVITY_OAUTH_CLIENT_SECRET:-}
      - DINGTALK_CONNECT_CLIENT_SECRET=${DINGTALK_CONNECT_CLIENT_SECRET:-}
      - GEMINI_OAUTH_CLIENT_SECRET=${GEMINI_OAUTH_CLIENT_SECRET:-}
      - GITHUB_OAUTH_CLIENT_SECRET=${GITHUB_OAUTH_CLIENT_SECRET:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - LINUXDO_CONNECT_CLIENT_SECRET=${LINUXDO_CONNECT_CLIENT_SECRET:-}
      - OIDC_CONNECT_CLIENT_SECRET=${OIDC_CONNECT_CLIENT_SECRET:-}
      - PAYMENT_RESUME_SIGNING_KEY=${PAYMENT_RESUME_SIGNING_KEY:-}
      - PLUGINS_DOWNLOAD_PROXY=${PLUGINS_DOWNLOAD_PROXY:-}
      - PLUGINS_PLUGIN_HTTP_PROXY=${PLUGINS_PLUGIN_HTTP_PROXY:-}
      - UPDATE_GITHUB_TOKEN=${UPDATE_GITHUB_TOKEN:-}
      - UPDATE_PROXY_URL=${UPDATE_PROXY_URL:-}
      - WECHAT_CONNECT_APP_SECRET=${WECHAT_CONNECT_APP_SECRET:-}
      - WECHAT_CONNECT_MOBILE_APP_SECRET=${WECHAT_CONNECT_MOBILE_APP_SECRET:-}
      - WECHAT_CONNECT_MP_APP_SECRET=${WECHAT_CONNECT_MP_APP_SECRET:-}
      - WECHAT_CONNECT_OPEN_APP_SECRET=${WECHAT_CONNECT_OPEN_APP_SECRET:-}
      - WECHAT_OAUTH_MP_APP_SECRET=${WECHAT_OAUTH_MP_APP_SECRET:-}
      - WECHAT_OAUTH_OPEN_APP_SECRET=${WECHAT_OAUTH_OPEN_APP_SECRET:-}
      - YESCAPTCHA_API_KEY=${YESCAPTCHA_API_KEY:-}
      - YESCAPTCHA_CLIENT_KEY=${YESCAPTCHA_CLIENT_KEY:-}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tokenrouter-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-T",
          "5",
          "-O",
          "/dev/null",
          "http://localhost:8080/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      # The application also retries transient database startup errors. This
      # grace period keeps Compose from declaring it unhealthy during bootstrap.
      start_period: 120s

  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  postgres:
    image: postgres:18-alpine
    container_name: tokenrouter-postgres
    restart: unless-stopped
    # Limit PostgreSQL process memory and its file-page cache so the database
    # working set cannot exhaust the host virtual machine.
    mem_limit: 24g
    memswap_limit: 24g
    # Reserve dynamic shared memory for parallel queries so the Docker default
    # 64 MiB limit does not cause query failures.
    shm_size: ${POSTGRES_SHM_SIZE:-1gb}
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    # Pass tuning values from .env.example to PostgreSQL. Unset variables use
    # PostgreSQL 18 defaults, preserving behavior for deployments without
    # tuning overrides.
    command: >
      postgres
      -c max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
      -c shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}
      -c effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-4GB}
      -c maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}
    volumes:
      # Local directory mapping for easy migration
      - ./postgres_data:/var/lib/postgresql/data:Z
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-tokenrouter}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-tokenrouter}
      - PGDATA=/var/lib/postgresql/data
      - TZ=${TZ:-Asia/Shanghai}
    networks:
      - tokenrouter-network
    healthcheck:
      # Require a successful SQL query before starting the application, so
      # connection readiness alone cannot release its database dependency.
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-tokenrouter} -d ${POSTGRES_DB:-tokenrouter} && psql -U ${POSTGRES_USER:-tokenrouter} -d ${POSTGRES_DB:-tokenrouter} -Atqc 'SELECT 1' >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      # Allow startup recovery to finish before Compose rejects this dependency.
      retries: 18
      start_period: 60s
    # Keep this service port unpublished; the application connects through the
    # internal network instead of the host interface.
    # For temporary debugging, add: ports: ["127.0.0.1:5433:5432"]

  # ===========================================================================
  # Redis Cache
  # ===========================================================================
  redis:
    image: redis:8-alpine
    container_name: tokenrouter-redis
    restart: unless-stopped
    # The 2 GiB Redis limit leaves headroom above its expected small working
    # set while bounding unexpected memory growth.
    mem_limit: 2g
    memswap_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    volumes:
      # Local directory mapping for easy migration
      - ./redis_data:/data:Z
    # command passes a quoted script to the inner sh -c. Compose preserves the
    # newlines inside that script.
    # Continue each argument line with a backslash; otherwise the first line
    # starts redis-server without the remaining arguments.
    command: >
        sh -c '
          redis-server \
          --save 60 1 \
          --appendonly yes \
          --appendfsync everysec \
          --maxmemory ${REDIS_MAXMEMORY:-1536mb} \
          --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-noeviction} \
          ${REDIS_PASSWORD:+--requirepass "$REDIS_PASSWORD"}'
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      # REDISCLI_AUTH is used by redis-cli for authentication (safer than -a flag)
      - REDISCLI_AUTH=${REDIS_PASSWORD:-}
    networks:
      - tokenrouter-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

# =============================================================================
# Networks
# =============================================================================
networks:
  tokenrouter-network:
    driver: bridge
