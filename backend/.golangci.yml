version: "2"

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - gosec
    - govet
    - ineffassign
    - staticcheck
    - unused

  settings:
    depguard:
      # 依赖许可按源包和生产/测试角色维护；目标包的 $ 表示精确匹配。
      # 每个源文件命中一个 strict 包规则，并叠加全局禁令及必要的窄权限限制。
      # 同包新文件自动继承角色；新子包须登记，不能借父目录通配符绕过检查。
      rules:
        # 全局禁令与下方 strict 规则同时生效，任何角色都不能恢复旧应用图。
        architecture-retired-packages:
          list-mode: lax
          files:
            - $all
          deny:
            - pkg: github.com/TokenFlux/TokenRouter/internal/app/legacybridge$
              desc: 该包已退出架构；使用原生模块、契约或由 app 绑定的能力。
            - pkg: github.com/TokenFlux/TokenRouter/internal/app/legacybridge/
              desc: 该包已退出架构；使用原生模块、契约或由 app 绑定的能力。
            - pkg: github.com/TokenFlux/TokenRouter/internal/domain$
              desc: 该包已退出架构；使用原生模块、契约或由 app 绑定的能力。
            - pkg: github.com/TokenFlux/TokenRouter/internal/domain/
              desc: 该包已退出架构；使用原生模块、契约或由 app 绑定的能力。
            - pkg: github.com/TokenFlux/TokenRouter/internal/handler$
              desc: 该包已退出架构；使用原生模块、契约或由 app 绑定的能力。
            - pkg: github.com/TokenFlux/TokenRouter/internal/handler/
              desc: 该包已退出架构；使用原生模块、契约或由 app 绑定的能力。
            - pkg: github.com/TokenFlux/TokenRouter/internal/model$
              desc: 该包已退出架构；使用原生模块、契约或由 app 绑定的能力。
            - pkg: github.com/TokenFlux/TokenRouter/internal/model/
              desc: 该包已退出架构；使用原生模块、契约或由 app 绑定的能力。
            - pkg: github.com/TokenFlux/TokenRouter/internal/platform$
              desc: 该包已退出架构；使用原生模块、契约或由 app 绑定的能力。
            - pkg: github.com/TokenFlux/TokenRouter/internal/platform/
              desc: 该包已退出架构；使用原生模块、契约或由 app 绑定的能力。
            - pkg: github.com/TokenFlux/TokenRouter/internal/repository$
              desc: 该包已退出架构；使用原生模块、契约或由 app 绑定的能力。
            - pkg: github.com/TokenFlux/TokenRouter/internal/repository/
              desc: 该包已退出架构；使用原生模块、契约或由 app 绑定的能力。
            - pkg: github.com/TokenFlux/TokenRouter/internal/routes$
              desc: 该包已退出架构；使用原生模块、契约或由 app 绑定的能力。
            - pkg: github.com/TokenFlux/TokenRouter/internal/routes/
              desc: 该包已退出架构；使用原生模块、契约或由 app 绑定的能力。
            - pkg: github.com/TokenFlux/TokenRouter/internal/service$
              desc: 该包已退出架构；使用原生模块、契约或由 app 绑定的能力。
            - pkg: github.com/TokenFlux/TokenRouter/internal/service/
              desc: 该包已退出架构；使用原生模块、契约或由 app 绑定的能力。
        # 唯一组合根由外层调用模块；首次初始化只由 setup.go 接入 bootstrap。
        architecture-no-app-backreference:
          list-mode: lax
          files:
            - '**/backend/internal/**/*.go'
            - '!**/backend/internal/app/**'
            - '!**/backend/internal/setup/setup.go'
          deny:
            - pkg: github.com/TokenFlux/TokenRouter/internal/app$
              desc: 模块不能反向依赖组合根；能力由 app 注入。
            - pkg: github.com/TokenFlux/TokenRouter/internal/app/
              desc: 模块不能反向依赖组合根；能力由 app 注入。
        # 备份与维护保持纯编排，不能自行读取环境、运行子进程或连接存储。
        architecture-maintenance-core-io:
          list-mode: lax
          files:
            - '**/backend/internal/backup/*.go'
            - '**/backend/internal/ops/maintenance/*.go'
            - '!$test'
          deny:
            - pkg: os$
              desc: 备份和维护核心通过注入端口执行 I/O，实际操作归 provider 或 app。
            - pkg: os/exec
              desc: 备份和维护核心通过注入端口执行 I/O，实际操作归 provider 或 app。
            - pkg: net/http
              desc: 备份和维护核心通过注入端口执行 I/O，实际操作归 provider 或 app。
            - pkg: database/sql
              desc: 备份和维护核心通过注入端口执行 I/O，实际操作归 provider 或 app。
        # 新目录只允许基础值处理；新增包时须按职责登记。现有包的新文件自动继承本包规则。
        architecture-unclassified:
          list-mode: strict
          files:
            - $all
            - '!**/backend/cmd/cleanup-ingress-reject-logs/*.go'
            - '!**/backend/cmd/jwtgen/*.go'
            - '!**/backend/cmd/server/*.go'
            - '!**/backend/ent/*.go'
            - '!**/backend/ent/migrate/*.go'
