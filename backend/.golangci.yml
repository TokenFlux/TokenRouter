version: "2"

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - gosec
    - govet
    - ineffassign
    - staticcheck
    - unused

  settings:
    depguard:
      # 技术库按角色维护，内部关系按模块维护；两者与全局禁令共同生效。
      # 普通文件与辅助子包继承目录角色；纯叶子、平台边界和必要例外继续单独限制。
      rules:
        # 全局方向与必要的窄权限持续生效；同目录新文件和辅助子包不会继承例外。
        architecture-retired-packages:
          list-mode: lax
          files:
            - $all
          deny:
            - pkg: github.com/TokenFlux/TokenRouter/internal/app/legacybridge$
            - pkg: github.com/TokenFlux/TokenRouter/internal/app/legacybridge/
            - pkg: github.com/TokenFlux/TokenRouter/internal/domain$
            - pkg: github.com/TokenFlux/TokenRouter/internal/domain/
            - pkg: github.com/TokenFlux/TokenRouter/internal/handler$
            - pkg: github.com/TokenFlux/TokenRouter/internal/handler/
            - pkg: github.com/TokenFlux/TokenRouter/internal/model$
            - pkg: github.com/TokenFlux/TokenRouter/internal/model/
            - pkg: github.com/TokenFlux/TokenRouter/internal/platform$
            - pkg: github.com/TokenFlux/TokenRouter/internal/platform/
            - pkg: github.com/TokenFlux/TokenRouter/internal/repository$
            - pkg: github.com/TokenFlux/TokenRouter/internal/repository/
            - pkg: github.com/TokenFlux/TokenRouter/internal/routes$
            - pkg: github.com/TokenFlux/TokenRouter/internal/routes/
            - pkg: github.com/TokenFlux/TokenRouter/internal/service$
            - pkg: github.com/TokenFlux/TokenRouter/internal/service/
        architecture-no-app-backreference:
          list-mode: lax
          files:
            - '**/backend/internal/**/*.go'
            - '!**/backend/internal/app/**'
            - '!**/backend/internal/setup/setup.go'
          deny:
            - pkg: github.com/TokenFlux/TokenRouter/internal/app$
            - pkg: github.com/TokenFlux/TokenRouter/internal/app/
        architecture-maintenance-core-io:
          list-mode: lax
          files:
            - '**/backend/internal/backup/**'
            - '!**/backend/internal/backup/httpapi/**'
            - '!**/backend/internal/backup/provider/**'
            - '**/backend/internal/ops/maintenance/**'
            - '!$test'
          deny:
            - pkg: os$
            - pkg: os/exec
            - pkg: net/http
            - pkg: database/sql
        internal-account-restricted-1:
          list-mode: lax
          files:
            - '**/backend/internal/account/**'
            - '!**/backend/internal/account/httpapi/**'
            - '!**/backend/internal/account/postgres/**'
            - '!**/backend/internal/account/provider/**'
            - '!**/backend/internal/account/rediscache/**'
            - '!**/backend/internal/account/transfer/**'
            - '!**/backend/internal/account/usageview/**'
            - '!**/backend/internal/account/admin_editor_original_fixture_test.go'
            - '!**/backend/internal/account/admin_legacy_extra_original_test.go'
            - '!**/backend/internal/account/admin_shadow_original_test.go'
