version: "2"

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - gosec
    - govet
    - ineffassign
    - staticcheck
    - unused

  settings:
    depguard:
      rules:
        # Enforce: service must not depend on repository.
        service-no-repository:
          list-mode: original
          files:
            - "**/internal/service/**"
            - "!**/internal/service/ops_aggregation_service.go"
            - "!**/internal/service/ops_alert_evaluator_service.go"
            - "!**/internal/service/ops_cleanup_service.go"
            - "!**/internal/service/ops_metrics_collector.go"
            - "!**/internal/service/ops_scheduled_report_service.go"
            - "!**/internal/service/wire.go"
          deny:
            - pkg: github.com/TokenFlux/TokenRouter/internal/repository
              desc: "service must not import repository"
            - pkg: gorm.io/gorm
              desc: "service must not import gorm"
            - pkg: github.com/redis/go-redis/v9
              desc: "service must not import redis"
        handler-no-repository:
          list-mode: original
          files:
            - "**/internal/handler/**"
          deny:
            - pkg: github.com/TokenFlux/TokenRouter/internal/repository
              desc: "handler must not import repository"
            - pkg: gorm.io/gorm
              desc: "handler must not import gorm"
            - pkg: github.com/redis/go-redis/v9
              desc: "handler must not import redis"
        # S01：按目标职责约束新增代码；精确旧文件许可见阶段依赖账本。
        # @project-doc docs/operations/development_workflow.md#backend_dependency_rules
        core-identity:
          list-mode: strict
          files:
          - '**/internal/identity/**/*.go'
          - '**/internal/identity/*.go'
          - '!**/internal/identity/httpapi/**'
          - '!**/internal/identity/postgres/**'
          - '!**/internal/identity/rediscache/**'
          - '!**/internal/identity/provider/**'
          - '!**/internal/identity/testkit/**'
          - '!**/*_test.go'
          allow:
          - $gostd
          - github.com/TokenFlux/TokenRouter/internal/billing/pricing$
          - github.com/TokenFlux/TokenRouter/internal/gateway/clientmeta$
          - github.com/TokenFlux/TokenRouter/internal/identity$
          - github.com/TokenFlux/TokenRouter/internal/pkg/apperror$
          - github.com/TokenFlux/TokenRouter/internal/pkg/ipmatch$
          - github.com/TokenFlux/TokenRouter/internal/pkg/logredact$
          - github.com/TokenFlux/TokenRouter/internal/pkg/oauthpkce$
          - github.com/TokenFlux/TokenRouter/internal/pkg/pagination$
          - github.com/TokenFlux/TokenRouter/internal/pkg/timezone$
          - github.com/TokenFlux/TokenRouter/internal/protocol$
          - github.com/TokenFlux/TokenRouter/internal/routing/capability$
          - github.com/TokenFlux/TokenRouter/internal/scheduler/policy$
          - github.com/TokenFlux/TokenRouter/internal/upstream$
          - github.com/google/uuid$
          - github.com/shopspring/decimal$
          - github.com/tidwall/gjson$
          - github.com/tidwall/sjson$
          deny:
          - pkg: net/http
            desc: 按职责禁止该依赖；使用纯契约或由外层适配。
          - pkg: database/sql
            desc: 按职责禁止该依赖；使用纯契约或由外层适配。
          - pkg: net/rpc
            desc: 按职责禁止该依赖；使用纯契约或由外层适配。
        core-identity-tests:
          list-mode: strict
          files:
          - '**/internal/identity/**/*_test.go'
          - '**/internal/identity/*_test.go'
          - '!**/internal/identity/httpapi/**'
          - '!**/internal/identity/postgres/**'
