# security-scan.yml runs dependency vulnerability checks on pushes, pull requests,
# and the weekly schedule. The jobs use the repository security targets so local
# checks and CI cover the backend, frontend, and both independently versioned
# plugin SDKs.
name: Security Scan

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: |
            backend/go.sum
            plugin-sdk/go/go.sum
      - name: Backend and Go SDK security
        run: make security-go

  frontend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: 'pnpm'
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            plugin-sdk/web/pnpm-lock.yaml
      - name: Frontend and Web SDK security
        run: make security-frontend
